{% extends "base.html" %}
{% block content %}

<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-green-50 to-green-100 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl shadow-2xl">
    <div>
      <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
        Create New Password
      </h2>
      <p class="mt-2 text-center text-sm text-gray-600">
        Choose a secure password for your account
      </p>
    </div>
    
    {% if error %}
    <div class="rounded-md bg-red-50 p-4">
      <div class="flex">
        <div class="ml-3">
          <h3 class="text-sm font-medium text-red-800">{{ error }}</h3>
        </div>
      </div>
    </div>
    {% endif %}
    
    <form class="mt-8 space-y-6" action="{{ url_for('create_new_password') }}" method="POST">
      <div class="rounded-md shadow-sm space-y-4">
        <div>
          <label for="password" class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
          <input id="password" name="password" type="password" required minlength="6"
                 class="appearance-none rounded-lg relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-green-500 focus:border-green-500 sm:text-sm"
                 placeholder="Enter new password">
        </div>
        
        <div>
          <label for="confirm_password" class="block text-sm font-medium text-gray-700 mb-1">Confirm Password</label>
          <input id="confirm_password" name="confirm_password" type="password" required minlength="6"
                 class="appearance-none rounded-lg relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-green-500 focus:border-green-500 sm:text-sm"
                 placeholder="Confirm new password">
        </div>
      </div>

      <div class="bg-blue-50 border border-blue-200 rounded-lg p-4">
        <p class="text-sm text-blue-800">
          <strong>Password Requirements:</strong>
        </p>
        <ul class="text-xs text-blue-700 mt-2 space-y-1 list-disc list-inside">
          <li>At least 6 characters long</li>
          <li>Use a mix of letters and numbers</li>
          <li>Avoid common words or patterns</li>
        </ul>
      </div>

      <div>
        <button type="submit"
                class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
          <i class="fas fa-lock mr-2"></i>
          Set New Password
        </button>
      </div>
    </form>
  </div>
</div>

<script>
// Password match validation
document.querySelector('form').addEventListener('submit', function(e) {
  const password = document.getElementById('password').value;
  const confirm = document.getElementById('confirm_password').value;
  
  if (password !== confirm) {
    e.preventDefault();
    alert('Passwords do not match!');
  }
});
</script>

{% endblock %}
