{% extends "base.html" %}
{% block content %}

<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-green-50 to-green-100 py-12 px-4 sm:px-6 lg:px-8">
  <div class="max-w-md w-full space-y-8 bg-white p-10 rounded-2xl shadow-2xl">
    <div>
      <h2 class="mt-6 text-center text-3xl font-extrabold text-gray-900">
        Verify OTP
      </h2>
      <p class="mt-2 text-center text-sm text-gray-600">
        Enter the 6-digit code to change your password
      </p>
      {% if otp %}
      <div class="mt-4 p-4 bg-yellow-50 border border-yellow-200 rounded-lg">
        <p class="text-sm text-yellow-800 text-center">
          <strong>Your OTP:</strong> <span class="text-2xl font-mono">{{ otp }}</span>
        </p>
        <p class="text-xs text-yellow-600 text-center mt-2">
          Valid for 10 minutes
        </p>
      </div>
      {% endif %}
    </div>
    
    {% if error %}
    <div class="rounded-md bg-red-50 p-4">
      <div class="flex">
        <div class="ml-3">
          <h3 class="text-sm font-medium text-red-800">{{ error }}</h3>
        </div>
      </div>
    </div>
    {% endif %}
    
    <form class="mt-8 space-y-6" action="{{ url_for('verify_otp') }}" method="POST">
      <div class="rounded-md shadow-sm -space-y-px">
        <div>
          <label for="otp" class="sr-only">OTP Code</label>
          <input id="otp" name="otp" type="text" required maxlength="6" pattern="[0-9]{6}"
                 class="appearance-none rounded-lg relative block w-full px-3 py-3 border border-gray-300 placeholder-gray-500 text-gray-900 focus:outline-none focus:ring-green-500 focus:border-green-500 focus:z-10 sm:text-sm text-center text-2xl font-mono tracking-widest"
                 placeholder="000000">
        </div>
      </div>

      <div>
        <button type="submit"
                class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-lg text-white bg-green-600 hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500">
          Verify OTP
        </button>
      </div>
      
      <div class="text-center">
        <a href="{{ url_for('request_otp') }}" class="text-sm text-green-600 hover:text-green-500">
          Request new OTP
        </a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
